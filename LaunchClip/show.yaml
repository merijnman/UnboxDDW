# =============================================================================
# UNBOX - Mission to Metaphorical Space
# Cue sheet: the single source of truth for the 15-minute public-event video.
#
# Edit THIS file to change the show. Then re-render. Audio that did not change
# is taken from the cache and costs nothing.
#
# How to read it
#   at:       show time "MM:SS" at which the entry starts
#   say:      a speaker (see `voices`) says the `lines`. One entry = one TTS
#             request, so the voice flows naturally across its lines.
#   lines:    one subtitle unit each. `en` is spoken and shown, `nl` is shown.
#             A line can carry actions (screen/overlay/big/sound/ops) that fire
#             at the moment that line starts being spoken.
#   screen:   replace what is on screen (see `screens`)
#   overlay:  add an image on top of the current screen (cleared on next screen)
#   big:      giant centred text (countdown numbers)
#   sound:    play a sound from `sounds`
#   timer:    countdown clock on screen. `seconds:` or `until: "MM:SS"`
#   ops:      instruction for the humans in the room. Goes to the printed
#             run sheet and shows as a small marker in the corner of the video.
# =============================================================================

show:
  title: "Unbox - Mission to Metaphorical Space"
  duration: "14:25"
  audio_language: en
  subtitles: [en, nl]          # both on screen at the same time
  video: {width: 1920, height: 1080, fps: 25}
  bed: [bridge]                 # ambient layers under the whole show
  ops_markers: true            # show room cues small in the corner; false = run sheet only
  bed_gain_db: -14              # bed level relative to the sound reference (-20 LUFS)
  duck_bed_under_speech_db: -6  # everything that is not a voice dips this much while someone speaks

# -----------------------------------------------------------------------------
# House style (Unbox brand): colours and fonts for screens, timer and subtitles.
style:
  colours:
    purple_dark:  "#453758"   # backgrounds and panels
    purple:       "#6F57A1"
    purple_muted: "#725F7D"
    yellow:       "#FBC65E"   # accents, ops marker
    yellow_light: "#FADD91"   # Dutch text
    blue_light:   "#ACC2E7"
  heading_font: assets/fonts/Lexend-SemiBold.ttf
  body_font:    assets/fonts/Lexend-Light.ttf

# -----------------------------------------------------------------------------
# Voice effects (ffmpeg filter chains), applied locally after TTS. Tune by ear.
# Not in use since 8 October (voices stay clean); switch on with `fx:` per voice.
fx:
  # Old radio: steep 250-3800 Hz band, a little mid presence, compression and soft warmth.
  radio: "highpass=f=250:poles=2,highpass=f=250:poles=2,lowpass=f=3800:poles=2,lowpass=f=3800:poles=2,equalizer=f=1400:t=q:w=1.2:g=4,acompressor=threshold=-24dB:ratio=4:attack=5:release=120:makeup=2,asoftclip=type=tanh"
  # Commander: close and comfortable, only rounded off.
  radio_light: "highpass=f=90,lowpass=f=7500:poles=2,acompressor=threshold=-20dB:ratio=2.5:attack=10:release=150"
  aside: "anull"   # no filter: an aside is only quieter (see mix.ASIDE_DB)

# -----------------------------------------------------------------------------
voices:
  commander:
    label: "COMMANDER"
    voice_id: "a4CnuaYbALRvW39mDitg"          # "Dan - Captivating, Engaging and Inviting" (browser test 8 Oct)
    model_id: eleven_v4        # supports [audio tags] such as [chuckling]
    settings: {stability: 0.5, similarity_boost: 0.75, style: 0.0, use_speaker_boost: true, speed: 1.0}   # as in the browser test
    seed: 1101
    # fx: radio_light          # off since 8 Oct: clean voices sound better
    audition: "Welcome, crew. In twelve minutes, we launch to explore metaphorical space! It's not rocket science. Yikes."
  mission_control:
    label: "MISSION CONTROL"
    voice_id: "ys3XeJJA4ArWMhRpcX1D"          # "Jess" (team pick, 15 Oct); before: oTQK6KgOJHp8UGGZjwUu (male)
    model_id: eleven_v4
    settings: {stability: 0.70, similarity_boost: 0.75, style: 0.10, use_speaker_boost: true, speed: 1.0}
    seed: 2202
    # fx: radio                # off since 8 Oct: clean voices sound better
    squelch: true              # radio crackle before every turn (team feedback 15 Oct)
    audition: "Mission Control here. All systems nominal. [alarmed] Alert! Alert! [urgent] An anomaly has been detected. T minus ten seconds."
  ship_computer:
    label: "SHIP COMPUTER"
    voice_id: "VukfMVtvHInVUWoMNPiQ"          # "Herbert", robotic (team pick, 15 Oct)
    model_id: eleven_v4
    settings: {stability: 0.90, similarity_boost: 0.75, style: 0.0, use_speaker_boost: true, speed: 0.75}   # slow and flat
    seed: 3303
    audition: "Warning. Warning. Anomaly detected. Recalculating storage volume."

# -----------------------------------------------------------------------------
# Sounds are generated once (ElevenLabs sound effects, max 30 s each) and
# cached, or point to a file you supply yourself with `file:`.
sounds:
  bridge:          {file: assets/music/bridgesound.mp3, loop: true}   # supplied by the team (15 Oct)
  radio_crackle:   {prompt: "Short burst of radio static and squelch as a two-way radio channel opens", seconds: 1.5}
  # bridge_hum and console_beeps: the generated bed until 15 Oct, not in use (kept so the cache stays valid)
  bridge_hum:      {prompt: "Low steady spaceship bridge ambience, soft engine hum and air circulation, no melody, no voices", seconds: 30, loop: true,
                    filter: "lowpass=f=6000:poles=2"}
  console_beeps:   {prompt: "Sparse quiet computer console beeps and blips on a spaceship bridge, irregular, no melody", seconds: 22, loop: true,
                    filter: "bandreject=f=12530:width_type=h:w=300,lowpass=f=5000:poles=2,lowpass=f=5000:poles=2"}   # the take has a loud 12.5 kHz whine
  timer_end:       {prompt: "Three short soft low-pitched electronic beeps, warm mid-range tone, timer finished, no high-pitched sounds", seconds: 1.5,
                    filter: "lowpass=f=5000:poles=2,lowpass=f=5000:poles=2"}   # the first take beeped at 12.7 kHz (15 Oct)
  alarm:           {prompt: "Slow, deep sci-fi spaceship alarm: long rising and falling whooping tones, about one per second, spacey and reverberant, ominous rather than shrill", seconds: 9, gain_db: 4}
  computer_bleeps: {prompt: "Retro spaceship computer slowly recalculating: unhurried bleeps and bloops with short pauses between them, calm data processing", seconds: 7}
  rocket_launch:   {prompt: "Rocket launch: engine ignition, building rumble and roar, then fading into the distance", seconds: 25, gain_db: 4}
  # Tension: from the alarm to lift off. The volume is shaped in the timeline (sound_envelope).
  tension:         {prompt: "Urgent, heart-pounding sci-fi tension music for a spaceship emergency: a fast pulsing synth bass like a racing heartbeat, driving low drums and rising strings, suspenseful and cinematic, no resolution. Instrumental.", seconds: 58, music: true, gain_db: -4, fade_out: 1,
                    loop_length: 54}   # the take ends in silence after ~55 s; placed longer, it repeats the first 54 s
  # Pre-show: the last part of the 25-minute pre-show video, climaxing as the show starts (pre-show video: T16).
  preshow_finale:  {prompt: "Cinematic music building anticipation for a rocket launch: starts quiet and mysterious with soft synth pads and a ticking pulse, gradually adds drums and brass, rising steadily, ending on one big triumphant climax hit. Instrumental.", seconds: 45, music: true, gain_db: 0, fade_in: 3}
  celebration:     {prompt: "Triumphant, uplifting celebration music for a successful rocket launch: warm brass and strings over a light electronic pulse, joyful and proud, building to a bright peak and then gently resolving. Instrumental.", seconds: 80, music: true, gain_db: 0, fade_in: 3, fade_out: 6}

# -----------------------------------------------------------------------------
# Screens. `image` files live in assets/screens/. Until the real artwork is
# there, the build generates labelled placeholders with the same file names.
screens:
  title:         {image: title.png,         text_en: "UNBOX MISSION CONTROL",                 text_nl: ""}
  pen:           {image: pen.png}
  introduce:     {image: bridge.png,        text_en: "Introduce yourself to your crew",       text_nl: "Stel jezelf voor aan je crew"}
  pick:          {image: stickers.png,      text_en: "Pick ONE sticker: the one item you would bring to space. What could it stand for in working together?", text_nl: "Kies EEN sticker: het ene voorwerp dat je mee de ruimte in neemt. Waar kan het voor staan in samenwerken?"}
  share:         {image: bridge.png,        text_en: "Explain your object to your crew",      text_nl: "Leg je voorwerp uit aan je crew"}
  alert:         {image: alert.png,         text_en: "ALERT",                                 text_nl: "ALARM"}
  recalculating: {image: alert.png,         text_en: "RECALCULATING STORAGE VOLUME...",       text_nl: "OPSLAGRUIMTE WORDT HERBEREKEND..."}
  one_item:      {image: one_item.png,      text_en: "Choose ONE item for the whole crew",    text_nl: "Kies EEN voorwerp voor de hele crew"}
  load_rocket:   {image: rocket.png,        text_en: "Put your object in the rocket. Write down why you chose it.", text_nl: "Stop jullie voorwerp in de raket. Schrijf op waarom jullie het kozen."}
  all_go:        {image: rocket.png,        text_en: "ALL SYSTEMS GO",                        text_nl: "ALLE SYSTEMEN GEREED"}
  countdown:     {image: rocket.png}
  liftoff:       {image: liftoff.png}
  end:           {image: unbox_logo.png,    text_en: "Visit the Unbox exhibition around the corner\nunboxcollab.com",text_nl: "Bezoek de Unbox-tentoonstelling om de hoek"}

overlays:
  cloud_rocket: {image: cloud_rocket.png}
  cloud_text:   {image: cloud_text.png}
  cloud_carrot: {image: cloud_carrot.png}

# -----------------------------------------------------------------------------
# Artwork generated with ElevenLabs Image (`unbox images`). Only files that are
# missing from assets/screens/ are generated. A file you put there yourself is
# never overwritten. Screen texts are drawn by the build, never by the model.
# unbox_logo.png and a real photo of the stickers should come from the team.
artwork:
  model_id: gemini-3.1-flash-image
  resolution: 2K
  style: >-
    Retro-futuristic illustration in the style of a 1960s space-age travel poster,
    flat shapes with soft grain, a palette of deep purple, violet and dusty mauve
    with warm yellow and soft light-blue accents,
    cinematic lighting, calm composition with open space in the upper middle.
    No text, no letters, no numbers, no logos.
  images:
    title.png:    {prompt: "A friendly rocket on a launch pad at dusk, seen from a distance, stars appearing, a mission control building in the foreground"}
    pen.png:      {prompt: "A single classic ballpoint pen floating weightless in space, large in the frame, Earth glowing in the background"}
    bridge.png:   {prompt: "The bridge of a cosy retro spaceship with round windows, consoles with glowing buttons, empty crew chairs, stars outside"}
    stickers.png: {prompt: "A table seen from above with a scattered set of colourful round stickers showing simple everyday objects"}
    alert.png:    {prompt: "A spaceship corridor bathed in red emergency light, rotating warning beacons, dramatic but not scary"}
    one_item.png: {prompt: "A small cargo hatch of a rocket with space for exactly one object, a single spotlight shining into the empty compartment"}
    rocket.png:   {prompt: "A tall rocket on its launch pad in the evening, gantry lights on, steam venting at the base, ready for launch"}
    liftoff.png:  {prompt: "A rocket lifting off with a bright plume of fire and billowing smoke, seen from the side, sky turning from orange to navy"}
    cloud_rocket.png: {prompt: "A simple icon of a small rocket, centred on a plain light background", aspect_ratio: "1:1"}
    cloud_text.png:   {prompt: "A simple icon of an open notebook with handwriting lines, centred on a plain light background", aspect_ratio: "1:1"}
    cloud_carrot.png: {prompt: "A simple icon of a single carrot with leaves, centred on a plain light background", aspect_ratio: "1:1"}

# =============================================================================
# THE SHOW
# =============================================================================
timeline:

  # ---- 1. Warming up ---------------------------------------------- 00:00 ---
  - at: "00:00"
    screen: title
    sound: radio_crackle

  - at: "00:02"
    id: cmd_welcome
    say: commander
    lines:
      - en: "[clears throat] Welcome, crew. My name is Commander Matt A. Phor, [chuckling] but you can call me Matt."
        subtitle: "Welcome, crew. My name is Commander Matt A. Fore, but you can call me Matt."   # spelling only; the take says the same
        nl: "Welkom, crew. Ik ben Commander Matt A. Fore, maar zeg maar Matt."
      - en: "I will be your mission commander."
        nl: "Ik ben jullie missiecommandant."
      - en: "[excited] In twelve minutes, we launch to explore metaphorical space!"
        nl: "Over twaalf minuten vertrekken we om de metaforische ruimte te verkennen!"

  - at: "00:17"
    id: cmd_aside
    say: commander
    delivery: aside            # off-mic, quieter, subtitle in italics
    lines:
      - en: "[muttering] Brave idiots."
        nl: "Dappere dwazen."

  - at: "00:21"
    id: cmd_metaphors
    say: commander
    lines:
      - en: "Ahem. To help you and your crew prepare for your mission, you can recognise the Unbox support team by their Unbox uniforms."
        nl: "Ahum. Om jou en je crew te helpen met de voorbereiding op de missie, herken je het Unbox-ondersteuningsteam aan hun Unbox-uniform."
        ops: "Unbox team: point to the Unbox label on your shirt"
      - en: "Now. Metaphors help us find a shared language."
        nl: "Goed. Metaforen helpen ons een gedeelde taal te vinden."
      - en: "You all use metaphors, even if you didn't know it yet."
        nl: "Jullie gebruiken allemaal metaforen, ook als je dat nog niet wist."
      - en: "[chuckles] It's not rocket science."
        nl: "Het is geen raketwetenschap."
      - en: "[proudly] For example: this is a pen."
        nl: "Bijvoorbeeld: dit is een pen."
        screen: pen
      - en: "For me, as commander, this pen might be a metaphor for a spaceship, because it is long and pointy."
        nl: "Voor mij, als commander, kan deze pen een metafoor zijn voor een ruimteschip: lang en puntig."
        overlay: cloud_rocket
      - en: "[thoughtfully] But it can also be a metaphor for a memory, because you can write things down."
        nl: "Maar hij kan ook een metafoor zijn voor een herinnering, omdat je er dingen mee opschrijft."
        overlay: cloud_text
      - en: "[amused] And it might even represent a carrot. So: food!"
        nl: "En misschien staat hij zelfs voor een wortel. Eten dus!"
        overlay: cloud_carrot
      - en: "[warmly] You get the point. One thing can mean different things to different people."
        nl: "Je snapt het idee. Een ding kan voor verschillende mensen verschillende dingen betekenen."
      - en: "Today, we will share metaphors to help prepare you, our new crew, for launch."
        nl: "Vandaag delen we metaforen om jullie, onze nieuwe crew, voor te bereiden op de lancering."

  # ---- 2. Crew introduction and picking a metaphor ----------------- 01:13 ---
  - at: "01:13"
    id: mc_ready
    say: mission_control
    lines:
      - en: "Mission Control here. Crew, are you ready for your first task?"
        nl: "Hier Mission Control. Crew, zijn jullie klaar voor je eerste opdracht?"
      - en: "[dryly] Of course you are. You are highly trained astronauts, about to embark on a voyage to metaphorical space."
        nl: "Natuurlijk zijn jullie dat. Jullie zijn topgetrainde astronauten, aan de vooravond van een reis naar de metaforische ruimte."
      - en: "To get you started: introduce yourself to your crew members."
        nl: "Om te beginnen: stel jezelf voor aan je crewgenoten."
        screen: introduce
      - en: "[firmly] Briefly! You have thirty seconds."
        nl: "Kort! Jullie hebben dertig seconden."

  - at: "01:31"
    timer: {seconds: 30}

  - at: "02:01"
    id: mc_pick
    say: mission_control
    sound: timer_end
    lines:
      - en: "Time is up. T minus eleven minutes to launch."
        nl: "De tijd is om. Nog elf minuten tot de lancering."
      - en: "Now that you have introduced yourselves, you need to decide what you will bring with you on this mission."
        nl: "Nu jullie elkaar kennen, moeten jullie beslissen wat je meeneemt op deze missie."
      - en: "Look at the stickers on your table."
        nl: "Kijk naar de stickers op je tafel."
        screen: pick
      - en: "Each of you, pick one: the one item you would bring to space, if you only had room for one."
        nl: "Kies ieder er een: het ene voorwerp dat je mee de ruimte in neemt, als er maar plek is voor een."
      - en: "Think to yourself: what could that object represent, what things could it stand for that you need to work well together as a crew going to space?"
        nl: "Bedenk voor jezelf: waar kan dat voorwerp voor staan? Voor welke dingen die je als crew op weg naar de ruimte nodig hebt om goed samen te werken?"

  # ---- 3. Sharing the metaphors ------------------------------------ 02:36 ---
  - at: "02:36"
    id: cmd_share
    say: commander
    lines:
      - en: "[encouraging] Crew, your next task: explain to your crew what your object represents for you."
        nl: "Crew, je volgende opdracht: leg je crewgenoten uit waar jouw voorwerp voor jou voor staat."
        screen: share
      - en: "Why did you pick it? What does it bring to your journey together?"
        nl: "Waarom koos je het? Wat brengt het mee op jullie gezamenlijke reis?"
      - en: "You have five minutes."
        nl: "Jullie hebben vijf minuten."

  - at: "02:48"
    timer: {seconds: 300}

  - at: "03:48"
    id: mc_spotlight
    say: mission_control
    lines:
      - en: "Mission Control here. Please give every crew member a chance to share their object."
        nl: "Hier Mission Control. Geef elk crewlid de kans om zijn of haar voorwerp te delen."

  - at: "04:48"
    id: mc_nominal
    say: mission_control
    lines:
      - en: "Mission Control: three minutes of sharing time remaining. All systems nominal, proceed with preparations."
        nl: "Mission Control: nog drie minuten om te delen. Alle systemen nominaal, ga door met de voorbereidingen."

  - at: "05:48"
    id: mc_propellant
    say: mission_control
    lines:
      - en: "Propellant loading complete. Starting flight computer. Two minutes of sharing time remaining."
        nl: "Brandstof geladen. Boordcomputer wordt opgestart. Nog twee minuten om te delen."

  - at: "07:03"
    id: mc_warning
    say: mission_control
    lines:
      - en: "Mission Control here. Attention, all stations: sharing time is coming to an end."
        nl: "Hier Mission Control. Attentie, alle stations: de tijd om te delen loopt ten einde."
      - en: "Crew is requested to collect materials for space travel, so make sure you understand the objects of all your crewmates."
        nl: "De crew wordt verzocht materialen voor de ruimtereis te verzamelen. Zorg dus dat je de voorwerpen van al je crewgenoten begrijpt."
      - en: "T minus six minutes to launch!"
        nl: "Nog zes minuten tot de lancering!"

  - at: "07:30"
    ops: "Stand by: flashing lights, in 20 seconds"

  # ---- 4. Emergency: only one item fits ---------------------------- 07:48 ---
  - at: "07:48"
    id: mc_interrupted
    say: mission_control
    interrupted: true          # the alarm below cuts this turn off
    lines:
      - en: "[pleased] Excellent. We are now ready to begin the final—"
        nl: "Uitstekend. We zijn nu klaar om—"

  - at: "07:50.6"              # cuts the real take right after "ready to begin" (alignment, 15 Oct); retune if the take changes
    screen: alert
    sound: alarm
    ops: "FLASHING LIGHTS ON"

  - at: "07:50.6"
    sound: tension
    sound_until: "13:24"
    sound_envelope:            # dB on top of the sound's gain: loud alarm, background under the talk, loudest before go time
      - ["08:42", 0]
      - ["08:48", -9]
      - ["11:40", -6]          # still background while the crews write down their reasoning
      - ["12:30", -3]
      - ["12:42", 0]
      - ["13:22.5", 0]
      - ["13:24", -30]

  - at: "07:52"
    id: comp_warning
    say: ship_computer
    lines:
      - en: "Warning. Warning."
        nl: "Waarschuwing. Waarschuwing."

  - at: "07:57"
    id: mc_alert
    say: mission_control
    lines:
      - en: "[urgent] Mission Control here. An anomaly in the space-time continuum has been detected."
        nl: "Hier Mission Control. Er is een anomalie in het ruimte-tijdcontinuum gedetecteerd."
      - en: "Recalculating total storage volume."
        nl: "Totale opslagruimte wordt herberekend."
        screen: recalculating

  - at: "08:06"
    sound: computer_bleeps

  - at: "08:13"
    id: mc_done
    say: mission_control
    lines:
      - en: "[regretful] Unfortunately, calculations show that we only have space to take ONE item."
        nl: "Helaas blijkt uit de berekeningen dat we maar ruimte hebben voor een voorwerp."
        screen: one_item

  - at: "08:21"
    id: cmd_yikes
    say: commander
    lines:
      - en: "[nervous laugh] Yikes."
        nl: "Oei."

  - at: "08:24"
    id: cmd_select
    say: commander
    lines:
      - en: "[serious, sad] Crew, please select the one object that can represent as many of your crew members' needs as possible."
        nl: "Crew, kies het ene voorwerp dat voor de behoeften van zo veel mogelijk crewleden kan staan."
      - en: "You have four minutes."
        nl: "Jullie hebben vier minuten."
      - en: "Work together to see how that one object can represent your needs as a crew."
        nl: "Zoek samen uit hoe dat ene voorwerp voor jullie behoeften als crew kan staan."

  - at: "08:44"
    timer: {seconds: 240}      # three minutes to decide, the last minute to put the object in the rocket and write why
    ops: "Flashing lights off"


  - at: "09:44"
    id: mc_three_minutes
    say: mission_control
    lines:
      - en: "Storage bay recalibrated. Three minutes remaining."
        nl: "Laadruim opnieuw gekalibreerd. Nog drie minuten."

  - at: "10:44"
    id: mc_two_minutes
    say: mission_control
    lines:
      - en: "[serious] Two minutes remaining. Choose wisely, crew."
        nl: "Nog twee minuten. Kies verstandig, crew."

  - at: "11:44"
    id: mc_document
    say: mission_control
    lines:
      - en: "One minute remaining. Crew: please put your object in the rocket, and write down why you chose it to represent your crew."
        nl: "Nog een minuut. Crew: stop jullie voorwerp in de raket, en schrijf op waarom jullie het kozen om jullie crew te vertegenwoordigen."
        screen: load_rocket

  # ---- 5. Countdown and launch ------------------------------------- 12:45 ---
  - at: "12:45"
    id: cmd_go
    say: commander
    sound: timer_end
    lines:
      - en: "[excited] All crew members: it is go time!"
        nl: "Alle crewleden: het is zover!"
        screen: load_rocket
      - en: "Place your final item in the rocket and record your reasoning for posterity."
        nl: "Leg jullie definitieve voorwerp in de raket en leg jullie redenering vast voor het nageslacht."
      - en: "[shouting] Brace yourselves: preparing for launch!"
        nl: "Zet je schrap: we maken ons klaar voor de lancering!"

  - at: "12:56"
    ops: "Stand by for launch: smoke machine, flashing lights, curtain"

  - at: "13:01"
    id: mc_all_go
    say: mission_control
    lines:
      - en: "Mission Control to crew: all systems go. [with excitement] Prepare to unbox the unexpected!"
        nl: "Mission Control aan crew: alle systemen gereed. Maak je klaar om het onverwachte uit te pakken!"
        screen: all_go

  - at: "13:09"
    id: mc_countdown
    say: mission_control
    pace_seconds: 1.0          # after the first line: one line per second, each rendered separately
    lines:
      - {en: "T minus ten seconds.", nl: "Nog tien seconden.", screen: countdown}
      - {en: "Ten.",   nl: "Tien.",   big: "10"}
      - {en: "Nine.",  nl: "Negen.",  big: "9"}
      - {en: "Eight.", nl: "Acht.",   big: "8"}
      - {en: "Seven.", nl: "Zeven.",  big: "7"}
      - {en: "Six.",   nl: "Zes.",    big: "6"}
      - {en: "Five.",  nl: "Vijf.",   big: "5"}
      - {en: "Four.",  nl: "Vier.",   big: "4"}
      - {en: "Three.", nl: "Drie.",   big: "3", ops: "SMOKE MACHINE ON"}
      - {en: "Two.",   nl: "Twee.",   big: "2"}
      - {en: "One.",   nl: "Een.",    big: "1"}
      - {en: "[triumphant] Liftoff!", subtitle: "Lift off!", nl: "Lancering!", screen: liftoff, sound: rocket_launch, ops: "CURTAIN DROPS, flashing lights"}

  # ---- 6. Unbox revealed, sign-off --------------------------------- 13:28 ---
  # The sign-off follows the launch quickly, before people start to leave.
  - at: "13:28"
    sound: celebration
    ops: "Smoke machine off"

  - at: "13:31"
    id: cmd_outro
    say: commander
    lines:
      - en: "[warmly] Thank you, Unbox crew, for taking on new perspectives and exploring Unbox together."
        nl: "Dank je wel, Unbox-crew, dat jullie nieuwe perspectieven hebben ingenomen en samen Unbox hebben verkend."
        screen: end
      - en: "This was a small taste of the new worlds that metaphors can help us discover."
        nl: "Dit was een voorproefje van de nieuwe werelden die metaforen ons kunnen helpen ontdekken."
      - en: "You can use Unbox and its metaphors in many different settings that require working as a group."
        nl: "Je kunt Unbox en zijn metaforen gebruiken in allerlei situaties waarin je als groep samenwerkt."
      - en: "If you would like to dive deeper into metaphors, visit the Unbox exhibition space around the corner, talk to one of the Unbox team, or check out our website: unbox collab dot com."
        subtitle: "If you would like to dive deeper into metaphors, visit the Unbox exhibition space around the corner, talk to one of the Unbox team, or check out our website: unboxcollab.com."
        nl: "Wil je dieper in metaforen duiken? Bezoek de Unbox-tentoonstelling om de hoek, praat met iemand van het Unbox-team, of kijk op onze website: unboxcollab.com."
      - en: "[proudly] For now, this was Commander Matt A. Phor, signing off."
        subtitle: "For now, this was Commander Matt A. Fore, signing off."
        nl: "Voor nu was dit Commander Matt A. Fore. Over en uit."

  - at: "14:06"
    ops: "House lights up. Point people to the exhibition, the Unbox team and the bar."

