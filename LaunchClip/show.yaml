preshow:
  duration: "25:00"
  screen: {image: bridge.png, text_en: "NEXT LAUNCH IN", text_nl: "VOLGENDE LANCERING OVER"}
  timer: {until: "25:00"}
  bed: [bridge]
  bed_gain_db: -18
  finale: preshow_finale
  chatter:
    voice: mission_control
    every_seconds: [60, 150]     # random gap between two chatter lines
    random_seed: 7
    subtitles: false
    lines:
